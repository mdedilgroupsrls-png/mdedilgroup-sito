</span>
</a>
<nav aria-label="Menu principale" style="display: flex; flex-wrap: wrap; justify-content: center; gap: 8px 32px; padding: 18px 0; font-size: 13px; letter-spacing: 0.08em; font-weight: 500">

<section style="padding: 230px clamp(20px, 5vw, 72px) 0; max-width: 1320px; margin: 0 auto">
<p style="margin: 0; font-size: 12px; letter-spacing: 0.2em; color: #8A8478"><a href="/" style="color: #8A8478">HOME</a> / RISTRUTTURAZIONI INTERNI</p>
</section>

<section style="padding: 56px clamp(20px, 5vw, 72px) 72px">
<div style="max-width: 1320px; margin: 0 auto">
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 28px 64px; margin-bottom: 56px">
<div style="flex: 1 1 460px">
<p style="margin: 0 0 14px; font-size: 12px; letter-spacing: 0.38em; color: #C9A24A; font-weight: 600">RISTRUTTURAZIONI INTERNI</p>
<h1 style="margin: 0; font-family: 'Urbanist', sans-serif; font-weight: 400; font-size: clamp(34px, 3.6vw, 54px); line-height: 1.08">Dalla demolizione alle chiavi in mano</h1>
</div>
<div style="flex: 1 1 420px; max-width: 540px; color: #D8D2C6">
<p style="margin: 0 0 16px">Ristrutturiamo appartamenti, ville, locali commerciali, uffici e strutture ricettive, seguendo ogni fase con un’unica squadra e un unico referente: progetto, permessi, demolizioni, impianti, finiture e consegna.</p>
<p style="margin: 0">Tutti i lavori sono eseguiti dai nostri tecnici abilitati e ogni impianto viene consegnato con la sua certificazione di conformità.</p>
</div>
</div>
<ol style="list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); border-top: 1px solid #2A2722; border-left: 1px solid #2A2722">
<li style="padding: 30px 28px; border-right: 1px solid #2A2722; border-bottom: 1px solid #2A2722"><span style="font-size: 12px; letter-spacing: 0.2em; color: #C9A24A">01</span><h2 style="margin: 12px 0 8px; font-family: 'Urbanist', sans-serif; font-weight: 600; font-size: 20px">Progetto e pratiche</h2><p style="margin: 0; color: #8A8478; font-size: 14px">Rilievo, progetto esecutivo, render e CILA/SCIA.</p></li>
<li style="padding: 30px 28px; border-right: 1px solid #2A2722; border-bottom: 1px solid #2A2722"><span style="font-size: 12px; letter-spacing: 0.2em; color: #C9A24A">02</span><h2 style="margin: 12px 0 8px; font-family: 'Urbanist', sans-serif; font-weight: 600; font-size: 20px">Demolizioni</h2><p style="margin: 0; color: #8A8478; font-size: 14px">Pavimenti, massetti e tramezzi, con trasporto e smaltimento in discarica autorizzata.</p></li>
<li style="padding: 30px 28px; border-right: 1px solid #2A2722; border-bottom: 1px solid #2A2722"><span style="font-size: 12px; letter-spacing: 0.2em; color: #C9A24A">03</span><h2 style="margin: 12px 0 8px; font-family: 'Urbanist', sans-serif; font-weight: 600; font-size: 20px">Opere edili</h2><p style="margin: 0; color: #8A8478; font-size: 14px">Massetti, nuove pareti in lastre, controsoffitti e velette.</p></li>
<li style="padding: 30px 28px; border-right: 1px solid #2A2722; border-bottom: 1px solid #2A2722"><span style="font-size: 12px; letter-spacing: 0.2em; color: #C9A24A">04</span><h2 style="margin: 12px 0 8px; font-family: 'Urbanist', sans-serif; font-weight: 600; font-size: 20px">Impianti certificati</h2><p style="margin: 0; color: #8A8478; font-size: 14px">Elettrico, idrico, riscaldamento e climatizzazione, con dichiarazione di conformità.</p></li>
<li style="padding: 30px 28px; border-right: 1px solid #2A2722; border-bottom: 1px solid #2A2722"><span style="font-size: 12px; letter-spacing: 0.2em; color: #C9A24A">05</span><h2 style="margin: 12px 0 8px; font-family: 'Urbanist', sans-serif; font-weight: 600; font-size: 20px">Bagni e cucine</h2><p style="margin: 0; color: #8A8478; font-size: 14px">Demolizioni, impianti, massetti, posa di rivestimenti e montaggio dei sanitari.</p></li>
<li style="padding: 30px 28px; border-right: 1px solid #2A2722; border-bottom: 1px solid #2A2722"><span style="font-size: 12px; letter-spacing: 0.2em; color: #C9A24A">06</span><h2 style="margin: 12px 0 8px; font-family: 'Urbanist', sans-serif; font-weight: 600; font-size: 20px">Finiture e consegna</h2><p style="margin: 0; color: #8A8478; font-size: 14px">Posa dei pavimenti, porte, rasature e pitture, fino alla consegna delle chiavi.</p></li>
</ol>

</section>

<section id="simulatore" style="background: #171512; padding: 80px clamp(20px, 5vw, 72px) 40px">
<div style="max-width: 1320px; margin: 0 auto; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 24px 64px">
<div style="flex: 1 1 460px">
<p style="margin: 0 0 14px; font-size: 12px; letter-spacing: 0.38em; color: #C9A24A; font-weight: 600">SIMULATORE DI COSTO</p>
<h2 style="margin: 0; font-family: 'Urbanist', sans-serif; font-weight: 400; font-size: clamp(32px, 3.2vw, 48px); line-height: 1.08">Quanto costa la tua ristrutturazione?</h2>
</div>
<p style="flex: 1 1 400px; margin: 0; max-width: 520px; color: #D8D2C6">Rispondi alle domande: la stima si aggiorna mentre compili. Prezzi dal nostro listino e dalla Tariffa della Regione Lazio, IVA esclusa.</p>
</div>
</section>

<section style="background: #171512; padding: 24px clamp(20px, 5vw, 72px) 110px">
<div style="max-width: 1320px; margin: 0 auto; display: flex; flex-wrap: wrap; align-items: flex-start; gap: 48px">

<form style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 44px">

<fieldset class="grp">
<legend class="lg"><span class="nr">01</span>L’immobile</legend>
<label class="fld">Superficie interna (m²)<input class="inp" type="number" min="20" max="1000" value="{{mq}}" onChange="{{setMq}}"></label>
<div class="fld">A che piano si trova?<div class="pills"><sc-for list="{{pianoOpts}}" as="o" hint-placeholder-count="4"><button type="button" class="pill" aria-pressed="{{o.pressed}}" onClick="{{o.pick}}">{{o.label}}</button></sc-for></div></div>
<div class="fld">È in centro storico o in ZTL?<div class="pills"><sc-for list="{{centroOpts}}" as="o" hint-placeholder-count="2"><button type="button" class="pill" aria-pressed="{{o.pressed}}" onClick="{{o.pick}}">{{o.label}}</button></sc-for></div></div>
<div class="fld">Livello di finiture<div class="pills"><sc-for list="{{finOpts}}" as="o" hint-placeholder-count="3"><button type="button" class="pill" aria-pressed="{{o.pressed}}" onClick="{{o.pick}}">{{o.label}}</button></sc-for></div></div>
</fieldset>

<fieldset class="grp">
<legend class="lg"><span class="nr">02</span>Demolizioni e opere murarie</legend>
<div class="fld">Rimozione dei pavimenti esistenti<div class="pills"><sc-for list="{{pavRimOpts}}" as="o" hint-placeholder-count="2"><button type="button" class="pill" aria-pressed="{{o.pressed}}" onClick="{{o.pick}}">{{o.label}}</button></sc-for></div></div>
<div class="fld">Demolizione e rifacimento del massetto<div class="pills"><sc-for list="{{massOpts}}" as="o" hint-placeholder-count="2"><button type="button" class="pill" aria-pressed="{{o.pressed}}" onClick="{{o.pick}}">{{o.label}}</button></sc-for></div></div>
<div class="row2">
<label class="fld">Tramezzi da demolire (m² di parete)<input class="inp" type="number" min="0" value="{{demTram}}" onChange="{{setDemTram}}"><span class="hint">Lunghezza × altezza: 4 m × 2,7 m ≈ 11 m²</span></label>
<label class="fld">Nuovi tramezzi (m² di parete)<input class="inp" type="number" min="0" value="{{nuoviTram}}" onChange="{{setNuoviTram}}"><span class="hint">In lastre tipo Aquapanel o Siniat, sp. 8 cm, finiti</span></label>
</div>
<label class="fld">Controsoffitti in cartongesso (m²)<input class="inp" type="number" min="0" value="{{controsoffitti}}" onChange="{{setControsoffitti}}"></label>
</fieldset>

<fieldset class="grp">
<legend class="lg"><span class="nr">03</span>Impianti</legend>
<p class="hint" style="margin: 0; font-size: 13px; color: #C9A24A">Tutti i nostri impianti sono realizzati da tecnici abilitati e consegnati con dichiarazione di conformità (DM 37/08).</p>
<div class="fld">Impianto elettrico<div class="pills"><sc-for list="{{elOpts}}" as="o" hint-placeholder-count="3"><button type="button" class="pill" aria-pressed="{{o.pressed}}" onClick="{{o.pick}}">{{o.label}}</button></sc-for></div><span class="hint">Rifacimento completo: circa {{punti}} punti luce e prese con frutti tipo BTicino inclusi, assistenza muraria e quadro elettrico</span></div>
<div class="fld">Rifacimento della rete idrica<div class="pills"><sc-for list="{{idrOpts}}" as="o" hint-placeholder-count="2"><button type="button" class="pill" aria-pressed="{{o.pressed}}" onClick="{{o.pick}}">{{o.label}}</button></sc-for></div></div>
<div class="fld">Impianto della cucina<div class="pills"><sc-for list="{{cucOpts}}" as="o" hint-placeholder-count="2"><button type="button" class="pill" aria-pressed="{{o.pressed}}" onClick="{{o.pick}}">{{o.label}}</button></sc-for></div></div>
<label class="fld">Nuovi punti acqua (n°)<input class="inp" type="number" min="0" value="{{puntiAcqua}}" onChange="{{setPuntiAcqua}}"><span class="hint">Lavatrice, boiler, lavabo aggiuntivo…</span></label>
<div class="row2">
<label class="fld">Termosifoni da sostituire (n°)<input class="inp" type="number" min="0" value="{{radiatori}}" onChange="{{setRadiatori}}"></label>
<label class="fld">Condizionatori, unità interne (n°)<input class="inp" type="number" min="0" value="{{split}}" onChange="{{setSplit}}"></label>
</div>
<div class="fld">Nuova caldaia a condensazione<div class="pills"><sc-for list="{{calOpts}}" as="o" hint-placeholder-count="2"><button type="button" class="pill" aria-pressed="{{o.pressed}}" onClick="{{o.pick}}">{{o.label}}</button></sc-for></div></div>
<div class="fld">Riscaldamento a pavimento (radiante)<div class="pills"><sc-for list="{{radOpts}}" as="o" hint-placeholder-count="2"><button type="button" class="pill" aria-pressed="{{o.pressed}}" onClick="{{o.pick}}">{{o.label}}</button></sc-for></div></div>
</fieldset>

<fieldset class="grp">
<legend class="lg"><span class="nr">04</span>Bagni</legend>
<div class="row2">
<label class="fld">Bagni da rifare (n°)<input class="inp" type="number" min="0" max="10" value="{{bagni}}" onChange="{{setBagni}}"></label>
<label class="fld">Superficie media di un bagno (m²)<input class="inp" type="number" min="2" max="30" value="{{mqBagno}}" onChange="{{setMqBagno}}"></label>
</div>
<p class="hint" style="margin: 0">Bagno fino a 5 m²: demolizioni, impianti, massetto, posa di pavimento e rivestimento, montaggio di sanitari e accessori. Fornitura di rivestimenti, sanitari e accessori esclusa.</p>
</fieldset>

<fieldset class="grp">
<legend class="lg"><span class="nr">05</span>Finiture</legend>
<div class="fld">Posa dei nuovi pavimenti in tutta la casa<div class="pills"><sc-for list="{{pavOpts}}" as="o" hint-placeholder-count="2"><button type="button" class="pill" aria-pressed="{{o.pressed}}" onClick="{{o.pick}}">{{o.label}}</button></sc-for></div></div>
<label class="fld">Porte interne da sostituire (n°)<input class="inp" type="number" min="0" value="{{porte}}" onChange="{{setPorte}}"></label>
<div class="fld">Rasatura e tinteggiatura di pareti e soffitti<div class="pills"><sc-for list="{{tinOpts}}" as="o" hint-placeholder-count="2"><button type="button" class="pill" aria-pressed="{{o.pressed}}" onClick="{{o.pick}}">{{o.label}}</button></sc-for></div></div>
<div class="fld">Progetto di interior design, tavole esecutive e pratiche (CILA/SCIA)<div class="pills"><sc-for list="{{praOpts}}" as="o" hint-placeholder-count="2"><button type="button" class="pill" aria-pressed="{{o.pressed}}" onClick="{{o.pick}}">{{o.label}}</button></sc-for></div></div>
</fieldset>
</form>

<aside aria-label="Stima del preventivo" style="flex: 1 1 340px; position: sticky; top: 24px; background: #171512; border: 1px solid #C9A24A; padding: 36px 32px">
<p style="margin: 0 0 10px; font-size: 12px; letter-spacing: 0.3em; color: #C9A24A; font-weight: 600">LA TUA STIMA</p>
<p style="margin: 0; font-family: 'Urbanist', sans-serif; font-weight: 600; font-size: clamp(28px, 2.6vw, 38px); line-height: 1.15; color: #E2C373">€ {{min}} – € {{max}}</p>
<p style="margin: 6px 0 26px; font-size: 13px; color: #8A8478">IVA esclusa · {{perMq}} €/m² circa</p>
<ul style="list-style: none; margin: 0 0 26px; padding: 0; border-top: 1px solid #2A2722; font-size: 14px">
<sc-for list="{{rows}}" as="r" hint-placeholder-count="6"><li style="display: flex; justify-content: space-between; gap: 16px; padding: 10px 0; border-bottom: 1px solid #2A2722"><span style="color: #D8D2C6">{{r.label}}</span><span style="white-space: nowrap">€ {{r.val}}</span></li></sc-for>
</ul>
<p style="margin: 0 0 22px; display: flex; gap: 10px; align-items: flex-start; font-size: 13px; line-height: 1.5; color: #D8D2C6"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" style="flex: 0 0 auto; fill: none; stroke: #C9A24A; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round"><path d="M12 2.5 4 5.5v6c0 5 3.4 8.6 8 10 4.6-1.4 8-5 8-10v-6z"></path><path d="m8.8 12 2.2 2.2 4.2-4.4"></path></svg>Tutti i lavori sono eseguiti dai nostri tecnici abilitati, con certificazione di conformità.</p>
<a href="/" style="display: block; text-align: center; background: #C9A24A; color: #0E0D0B; padding: 17px 20px; font-weight: 600; font-size: 13px; letter-spacing: 0.14em">PRENOTA IL SOPRALLUOGO</a>
<p style="margin: 18px 0 0; font-size: 12px; line-height: 1.55; color: #8A8478">Stima indicativa basata sul listino MD Edil Group e sulla Tariffa dei prezzi della Regione Lazio (ed. 2023). Non costituisce offerta: il prezzo definitivo viene confermato dopo il sopralluogo e con la firma del contratto. Esclusa la fornitura di pavimenti, rivestimenti, sanitari e accessori, che sceglierai con noi. Infissi esclusi: usa il simulatore dedicato.</p>
</aside>

</div>
</section>

<footer style="padding: 56px clamp(20px, 5vw, 72px) 40px; border-top: 1px solid #2A2722">
<div style="max-width: 1320px; margin: 0 auto; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 28px">
<img src="/img/cc07e2f1120eb45d8438fc5d59d4b3e8.png" alt="MD Edil Group" style="display: block; height: 52px; width: auto">
<div style="display: flex; gap: 14px">

</div>

<script>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { mq: '90', piano: 'p1', centro: 'no', fin: 'pregio', pavRim: 'si', mass: 'no', demTram: '0', nuoviTram: '0', controsoffitti: '0', el: 'rif', idr: 'si', cuc: 'si', puntiAcqua: '0', radiatori: '0', split: '0', cal: 'no', rad: 'no', bagni: '1', mqBagno: '5', pav: 'si', porte: '0', tin: 'si', pra: 'si' };
}
renderVals() {
// PREZZI UNITARI (€, IVA esclusa) - listino MD Edil Group, con voci di riferimento della Tariffa Regione Lazio 2023 (DGR 101/2023)
const P = {
rimPav: 15.21,        // rimozione pavimento e piastrelle, compreso trasporto e discarica (m²) - rif. A 3.01.15.c
demMass: 16.72,       // demolizione massetto, compreso trasporto e discarica (m²)
demTram: 27,          // demolizione tramezzi, compreso trasporto e discarica (m²)
nuovoMass: 32.19,     // nuovo massetto fino a 5 cm (m²)
nuovoTram: 95,        // nuovo tramezzo in lastre (tipo Aquapanel / Siniat) sp. 8 cm, finito (m²)
controsoffitto: 59.80,// controsoffitto in cartongesso (m²)
puntoEl: 90, puntiPerMq: 1, // punto luce o presa con frutto tipo BTicino, assistenza muraria inclusa (cad); 1 punto per m²
idrico: 1200,         // rete idrica dell'appartamento (a corpo)
cucina: 1200,         // impianto della cucina (a corpo)
puntoAcqua: 300,      // nuovo punto idrico: linea + posa apparecchio (lavatrice, boiler...) (cad)
radiatore: 300,       // linea + posa e collegamento nuovo termosifone (cad)
split: 1598.01, splitExtra: 500, // E03055b climatizzatore 2,5 kW con un'unità interna; ogni split in più, assistenza muraria inclusa
caldaia: 3339.49,     // E02202b - caldaia a condensazione 23 kW (cad)
radianteFisso: 3467.66, radiante: 85.68, // E02004a quota fissa + E02004b pannello radiante a pavimento (m²)
bagnoFino5: 6500, bagnoExtraMq: 900,     // bagno fino a 5 m² (fornitura rivestimenti, sanitari e accessori esclusa); ogni m² oltre i 5
posaPav: 37,          // posa pavimento in gres porcellanato, fornitura esclusa (m²)
porta: 866.68,        // A 16.01.4.a - porta tamburata 515,88 €/m² x 1,68 m² (cad)
tinteggiatura: 32,    // rasatura + pittura (m² di parete/soffitto)
progetto: 50,         // interior design: progetto esecutivo completo, tavole impianti, CILA/SCIA (m²)
tiro: { villa: 0, p1: 0, asc: 25, noasc: 40, alto: 55 } // tiro in alto/in basso dei materiali (€/m³) - PROVVISORIO, da confermare
};
const s = this.state;
const n = (v) => { const x = parseFloat(String(v).replace(',', '.')); return isNaN(x) || x < 0 ? 0 : x; };
const mq = n(s.mq), bagni = Math.round(n(s.bagni)), mqB = n(s.mqBagno) || 5;
const FIN = { std: 1, pregio: 1.3, lusso: 1.7 };
const f = FIN[s.fin];
const yes = (k) => s[k] === 'si';
const punti = Math.round(mq * P.puntiPerMq);
const nSplit = Math.round(n(s.split));
// volumi movimentati (m³): macerie in discesa, massetto nuovo in salita
const volGiu = (yes('pavRim') ? mq * 0.05 : 0) + (yes('mass') ? mq * 0.06 : 0) + n(s.demTram) * 0.1;
const volSu = yes('mass') ? mq * 0.05 : 0;
const tiro = (volGiu + volSu) * P.tiro[s.piano];
const demol = (yes('pavRim') ? mq * P.rimPav : 0) + (yes('mass') ? mq * P.demMass : 0) + n(s.demTram) * P.demTram + tiro;
const murarie = (yes('mass') ? mq * P.nuovoMass : 0) + n(s.nuoviTram) * P.nuovoTram + n(s.controsoffitti) * P.controsoffitto * f;
// quadro elettrico: 750 € fino a 70 m², 1.000 € fino a 100 m², poi +250 € ogni 20 m² in più
const quadro = mq <= 70 ? 750 : mq <= 100 ? 1000 : 1000 + Math.ceil((mq - 100) / 20) * 250;
const el = s.el === 'rif' ? punti * P.puntoEl + quadro : s.el === 'adeg' ? Math.round(punti * 0.3) * P.puntoEl + quadro : 0;
const impianti = el + (yes('idr') ? P.idrico : 0) + (yes('cuc') ? P.cucina : 0) + n(s.puntiAcqua) * P.puntoAcqua
+ n(s.radiatori) * P.radiatore + (nSplit > 0 ? P.split + (nSplit - 1) * P.splitExtra : 0) + (yes('cal') ? P.caldaia : 0) + (yes('rad') ? P.radianteFisso + mq * P.radiante : 0);
const bagniTot = bagni * (P.bagnoFino5 + Math.max(0, mqB - 5) * P.bagnoExtraMq);
const mqPav = Math.max(0, mq - bagni * mqB);
const pavimenti = yes('pav') ? mqPav * P.posaPav : 0;
const finiture = pavimenti + (n(s.porte) * P.porta + (yes('tin') ? mq * 3 * P.tinteggiatura : 0)) * f;
const coef = yes('centro') ? 1.05 : 1;
const prog = yes('pra') ? mq * P.progetto : 0;
const lavori = (demol + murarie + impianti + bagniTot + finiture) * coef;
const sicurezza = lavori * 0.05; // oneri per la sicurezza 5% dei lavori
const tot = lavori + sicurezza + prog;
const fmt = (v) => String(Math.round(v)).replace(/\B(?=(\d{3})+(?!\d))/g, '.');
const r500 = (v) => Math.round(v / 500) * 500;
const rows = [
{ label: 'Demolizioni e smaltimento', v: demol * coef },
{ label: 'Massetti, tramezzi e controsoffitti', v: murarie * coef },
{ label: 'Impianti', v: impianti * coef },
{ label: 'Bagni', v: bagniTot * coef },
{ label: 'Pavimenti, porte e pitture', v: finiture * coef },
{ label: 'Oneri per la sicurezza (5%)', v: sicurezza },
{ label: 'Progetto e pratiche', v: prog }
].filter((r) => r.v > 0).map((r) => ({ label: r.label, val: fmt(r.v) }));
const set = (k) => (e) => this.setState({ [k]: e.target.value });
const opts = (k, list) => list.map(([v, label]) => ({ label, pressed: s[k] === v ? 'true' : 'false', pick: () => this.setState({ [k]: v }) }));
const sn = (k) => opts(k, [['si', 'Sì'], ['no', 'No']]);
return {
headFont: this.props.headFont ?? 'Urbanist',
nameJustify: this.props.nameJustify ?? 'flex-start',
mq: s.mq, demTram: s.demTram, nuoviTram: s.nuoviTram, controsoffitti: s.controsoffitti, puntiAcqua: s.puntiAcqua, radiatori: s.radiatori, split: s.split, bagni: s.bagni, mqBagno: s.mqBagno, porte: s.porte,
setMq: set('mq'), setDemTram: set('demTram'), setNuoviTram: set('nuoviTram'), setControsoffitti: set('controsoffitti'), setPuntiAcqua: set('puntiAcqua'), setRadiatori: set('radiatori'), setSplit: set('split'), setBagni: set('bagni'), setMqBagno: set('mqBagno'), setPorte: set('porte'),
punti: String(punti),
pianoOpts: opts('piano', [['villa', 'Villa o casa indipendente'], ['p1', 'Piano terra o 1°'], ['asc', '2° o oltre con ascensore'], ['noasc', '2°–4° senza ascensore'], ['alto', '5° o oltre senza ascensore']]),
centroOpts: sn('centro'),
finOpts: opts('fin', [['std', 'Standard'], ['pregio', 'Pregio'], ['lusso', 'Lusso']]),
pavRimOpts: sn('pavRim'), massOpts: sn('mass'),
elOpts: opts('el', [['no', 'Non serve'], ['adeg', 'Adeguamento'], ['rif', 'Rifacimento completo']]),
idrOpts: sn('idr'), cucOpts: sn('cuc'), calOpts: sn('cal'), radOpts: sn('rad'),
pavOpts: sn('pav'), tinOpts: sn('tin'), praOpts: sn('pra'),
min: fmt(r500(tot * 0.9)), max: fmt(r500(tot * 1.15)), perMq: mq > 0 ? fmt(tot / mq) : '0',
rows: rows
};
}
}
