<p class="guida-ey">GUIDA ALLE LAVORAZIONI</p>
<h2 id="guida-t">Guida alle lavorazioni di ristrutturazione</h2>
<p class="guida-intro">Tutte le lavorazioni del nostro simulatore, spiegate una per una: cosa comprendono, quando servono e come si misurano. Le eseguiamo a Roma e in tutto il Lazio, con tecnici abilitati e impianti certificati.</p>
<details>
<summary><h3>Demolizioni e rimozioni</h3></summary>
<p>Smontiamo e portiamo via ciò che va rifatto. Dove indicato, carico, trasporto e smaltimento in discarica autorizzata sono compresi.</p>
<dl>
<dt>Rimozione di pavimenti in ceramica</dt>
<dd>Togliamo le piastrelle esistenti e lasciamo il massetto sottostante. Comprende carico, trasporto e smaltimento in discarica autorizzata.</dd>
<dt>Rimozione di pavimenti in ceramica con il massetto (fino a 5 cm)</dt>
<dd>Togliamo piastrelle e sottofondo fino a 5 cm di spessore: serve quando si rifà il pavimento da zero o passano nuovi impianti sotto il pavimento. Smaltimento in discarica compreso.</dd>
<dt>Demolizione di controsoffitti in cartongesso</dt>
<dd>Smontaggio di lastre e struttura metallica del controsoffitto esistente, con trasporto e smaltimento del materiale.</dd>
<dt>Demolizione di tramezzi interni</dt>
<dd>Abbattimento di pareti divisorie non portanti, spesse da 4,5 a 10 cm. Si misura la superficie della parete: lunghezza × altezza (es. 4 m × 2,7 m ≈ 11 m²). Per i muri portanti serve prima la verifica del nostro tecnico.</dd>
<dt>Smontaggio di porte interne</dt>
<dd>Rimozione di anta, telaio e coprifili delle porte esistenti, con smaltimento in discarica autorizzata.</dd>
<dt>Rimozione di termosifoni</dt>
<dd>Scollegamento e smontaggio dei termosifoni esistenti, per sostituirli o spostarli.</dd>
<dt>Rimozione di battiscopa</dt>
<dd>Rimozione dei battiscopa in legno o ceramica. Si misura in metri lineari: il perimetro delle stanze, senza le porte.</dd>
<dt>Rimozione di parquet</dt>
<dd>Rimozione del parquet esistente, con trasporto e smaltimento in discarica autorizzata.</dd>
<dt>Protezione dei pavimenti da conservare</dt>
<dd>Copriamo con cartone ondulato i pavimenti che restano, per proteggerli da urti, polvere e sporco per tutta la durata dei lavori.</dd>
<dt>Smontaggio dell’impianto elettrico esistente</dt>
<dd>Rimozione di cavi, scatole, frutti e quadro del vecchio impianto in tutta la casa, per fare spazio al nuovo impianto a norma.</dd>
<dt>Smontaggio dell’impianto idrico esistente</dt>
<dd>Rimozione delle vecchie tubazioni di carico e scarico in tutta la casa, prima di realizzare l’impianto nuovo.</dd>
</dl>
</details>
<details>
<summary><h3>Bagno chiavi in mano</h3></summary>
<p>Un solo importo per tutte le lavorazioni del bagno. Non indicare di nuovo queste lavorazioni nelle altre voci.</p>
<dl>
<dt>Rifacimento completo del bagno</dt>
<dd>Dal vecchio bagno al nuovo, senza pensieri: smontaggio dei sanitari, demolizione di pavimenti, rivestimenti e sottofondi con smaltimento, nuovo massetto, nuovi impianti idrico ed elettrico con le opere murarie, impermeabilizzazione della doccia, posa di pavimento e rivestimenti in gres, rasatura e pittura, montaggio di sanitari, rubinetteria, piatto e box doccia, scaldasalviette e accessori, collaudo con dichiarazioni di conformità e pulizia finale. Il prezzo vale per un bagno fino a 5 m²: per un bagno più grande indica la sua superficie. Restano esclusi gres, sanitari, rubinetteria, doccia e accessori, che sceglierai con noi.</dd>
</dl>
</details>
<details>
<summary><h3>Opere murarie</h3></summary>
<p>Nuove pareti, sottofondi e intonaci per ridisegnare gli spazi.</p>
<dl>
<dt>Costruzione di nuovi tramezzi</dt>
<dd>Nuove pareti divisorie in muratura per cambiare la distribuzione degli ambienti. Si misura la superficie della parete: lunghezza × altezza.</dd>
<dt>Controtelaio per porta scorrevole a scomparsa</dt>
<dd>Fornitura e montaggio del controtelaio metallico che si inserisce nella parete e accoglie l’anta scorrevole. La posa della porta si indica a parte, nella sezione delle porte.</dd>
<dt>Intonaco grezzo</dt>
<dd>Primo strato di intonaco su pareti nuove o da ripristinare: è la base per rasatura e pittura.</dd>
<dt>Nuovo massetto in sabbia e cemento</dt>
<dd>Sottofondo tradizionale steso e livellato, pronto per la posa del nuovo pavimento.</dd>
</dl>
</details>
<details>
<summary><h3>Climatizzazione</h3></summary>
<p>Impianti per rinfrescare e riscaldare con i condizionatori.</p>
<dl>
<dt>Impianto di climatizzazione con un motore esterno e due split</dt>
<dd>Posa delle tubazioni tra il motore esterno e i due split interni, scarico della condensa, opere murarie e installazione. I condizionatori li scegliamo insieme: la fornitura è esclusa.</dd>
</dl>
</details>
<details>
<summary><h3>Impianto elettrico</h3></summary>
<p>Impianto nuovo, eseguito da tecnici abilitati e consegnato con dichiarazione di conformità.</p>
<dl>
<dt>Punti luce e prese</dt>
<dd>Ogni punto è un’uscita per una luce o una presa, a parete, a pavimento o a soffitto: comprende linee, scatole, frutti tipo BTicino e opere murarie. Per orientarti: circa un punto per ogni metro quadro di casa.</dd>
<dt>Nuovo quadro elettrico</dt>
<dd>Nuovo quadro con le protezioni dell’impianto, dimensionato sulla superficie della casa.</dd>
</dl>
</details>
<details>
<summary><h3>Impianto idrico e riscaldamento</h3></summary>
<p>Acqua, scarichi e termosifoni, con dichiarazione di conformità.</p>
<dl>
<dt>Collettore di distribuzione collegato alla caldaia</dt>
<dd>Predisposizione e montaggio della centralina da cui partono le tubazioni verso i termosifoni, con il collegamento alla caldaia.</dd>
<dt>Allaccio e posa di termosifoni</dt>
<dd>Tubazioni in multistrato fino a ogni termosifone, opere murarie e montaggio del nuovo termosifone. Fornitura dei termosifoni esclusa. Lo scaldasalviette del bagno è già compreso nel bagno chiavi in mano.</dd>
<dt>Installazione della caldaia a gas</dt>
<dd>Montaggio e collegamento della nuova caldaia. La caldaia la scegli tu o la scegliamo insieme: fornitura esclusa.</dd>
<dt>Nuovo punto acqua con scarico</dt>
<dd>Un attacco completo di acqua e scarico per lavello, lavatrice, lavastoviglie, lavabo o altri apparecchi, con le opere murarie.</dd>
</dl>
</details>
<details>
<summary><h3>Impianto gas</h3></summary>
<p>Linee del gas realizzate secondo le norme di sicurezza.</p>
<dl>
<dt>Linea del gas dal contatore alla cucina</dt>
<dd>Nuova tubazione dal contatore al piano cottura, con la valvola di chiusura prevista dalla normativa.</dd>
<dt>Linea del gas per la caldaia</dt>
<dd>Tubazione che porta il gas fino alla caldaia, con il collegamento.</dd>
</dl>
</details>
<details>
<summary><h3>Pavimenti, rivestimenti e porte</h3></summary>
<p>Posa dei materiali che scegli con noi: la fornitura è esclusa.</p>
<dl>
<dt>Posa di pavimenti in ceramica o gres (fino a 60 × 60 cm)</dt>
<dd>Posa a colla su sottofondo pronto, con tagli, stuccatura delle fughe e pulizia. Per le grandi lastre valutiamo insieme al sopralluogo.</dd>
<dt>Posa di rivestimenti a parete (fino a 60 × 60 cm)</dt>
<dd>Posa di piastrelle su pareti di cucina e altri ambienti, con tagli e stuccatura delle fughe. I rivestimenti del bagno chiavi in mano sono già compresi nella sua voce.</dd>
<dt>Posa di battiscopa</dt>
<dd>Posa dei battiscopa in legno o ceramica lungo il perimetro delle stanze. Si misura in metri lineari.</dd>
<dt>Posa di parquet</dt>
<dd>Posa del parquet su sottofondo pronto, con tagli e rifiniture lungo le pareti.</dd>
<dt>Posa di porte a battente</dt>
<dd>Montaggio della porta interna con telaio e coprifili, e regolazione di cerniere e serratura.</dd>
<dt>Posa di porte scorrevoli</dt>

<dd>Struttura metallica e lastre da 13 mm con giunti stuccati in due mani, pronto per rasatura e pittura. Serve per abbassare i soffitti, nascondere gli impianti e inserire i faretti.</dd>
<dt>Parete divisoria in cartongesso</dt>
<dd>Parete leggera spessa 10 cm, con struttura metallica e lastre sui due lati: si monta in poco tempo e si può attrezzare con impianti e nicchie.</dd>
<dt>Velette e mensole per luci LED</dt>

<dt>Raschiatura delle vecchie pitture</dt>

<dd>Stesura di rasante e stucco in pasta per rendere le superfici lisce e uniformi, pronte per la pittura.</dd>

<dd>Pittura lavabile in tinte forti o scure, che richiedono più colore e una stesura più accurata.</dd>
