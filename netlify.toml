[build]
  publish = "."

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/video/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

# La cartella di lavoro non va pubblicata sul sito
[[redirects]]
  from = "/progetto/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/CLAUDE.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/.github/*"
  to = "/404.html"
  status = 404
  force = true

# Protezione del sito: il browser carica solo i file del sito e i servizi indicati qui
# (caratteri Google, three.js per il modello 3D, mappa Google). Nessun altro sito può
# inserire script nelle pagine né mostrare il nostro sito dentro le sue pagine.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://*.behold.pictures https://*.cdninstagram.com; frame-src https://www.google.com https://maps.google.com; connect-src 'self' https://feeds.behold.so; form-action 'self' https://wa.me; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; upgrade-insecure-requests"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Cross-Origin-Opener-Policy = "same-origin"

# Contatore anonimo: mai in cache, così ogni evento arriva a Netlify
[[headers]]
  for = "/s.txt"
  [headers.values]
    Cache-Control = "no-store"
    X-Robots-Tag = "noindex"
