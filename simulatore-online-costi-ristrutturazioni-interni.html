<details id="come-funziona" class="voce"><summary><h2>Come funziona il simulatore</h2></summary><ol style="margin: 0 0 6px; padding-left: 20px"><li style="margin: 0 0 6px"><b style="color: #F3EFE7">Superficie e piano</b>: Indica i metri quadri della casa, il piano e se si trova in centro storico o in ZTL.</li><li style="margin: 0 0 6px"><b style="color: #F3EFE7">Lavorazioni voce per voce</b>: Apri i paragrafi che ti interessano e scrivi metri quadri, metri o numero di pezzi: le voci vuote non si calcolano.</li><li style="margin: 0 0 6px"><b style="color: #F3EFE7">Preventivo e sopralluogo</b>: Scarica il PDF con tutte le voci e mandacelo: ti richiamiamo per il sopralluogo e il preventivo definitivo.</li></ol></details>
<details id="cosa-calcola" class="voce"><summary><h2>Cosa calcola</h2></summary><p>Quanto costa ristrutturare un appartamento a Roma? Scrivi la superficie della casa e scegli solo le lavorazioni che ti servono: demolizioni, opere murarie, impianti elettrico, idrico e gas, pavimenti, cartongesso, rasature e pitture, oppure il bagno chiavi in mano. Il totale si aggiorna a ogni voce, con i prezzi del nostro listino IVA inclusa.</p><p>Quando hai finito scarichi il preventivo in PDF e ce lo mandi su WhatsApp: il sopralluogo a Roma e nel Lazio è gratuito.</p></details>
<details id="da-dove-vengono-i-prezzi" class="voce"><summary><h2>Da dove vengono i prezzi?</h2></summary><p>Sono i prezzi del listino MD Edil Group, gli stessi dei nostri preventivi, IVA inclusa. Per i lavori in centro storico o in ZTL il simulatore aggiunge il 5%.</p></details>
<details id="cosa-non-e-compreso" class="voce"><summary><h2>Cosa non è compreso?</h2></summary><p>La fornitura dei materiali che scegli tu: pavimenti, rivestimenti, sanitari, rubinetteria, porte, termosifoni, caldaia e condizionatori. Il bagno chiavi in mano comprende i materiali che restano murati.</p></details>
<details id="il-simulatore-e-gratuito" class="voce"><summary><h2>Il simulatore è gratuito?</h2></summary><p>Sì, è gratuito e non serve registrarsi. La stima resta sul tuo telefono o computer finché non decidi tu di mandarcela su WhatsApp.</p></details>
<details id="il-prezzo-e-definitivo" class="voce"><summary><h2>Il prezzo è definitivo?</h2></summary><p>No, è una stima indicativa. Il prezzo definitivo si conferma dopo il sopralluogo gratuito, con le misure prese dai nostri tecnici.</p></details>
